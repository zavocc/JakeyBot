[project]
name = "jakeybot"
version = "2.0.0"
description = "Run LLMs on your Discord!"
readme = "README.md"
authors = [
    { name = "zavocc", email = "buffer.0verfl0w1030@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.16.0",
    "openai>=2.53.0",
    "py-cord>=2.8.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
jakeybot = "jakeybot.bot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportUntypedFunctionDecorator = false
reportUnknownMemberType = false
